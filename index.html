<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="أحمد وريهام — عقد قران  | Ahmed &amp; Reham — Wedding Invitation"
    />
    <title>
      أحمد وريهام — عقد قران | Ahmed &amp; Reham — Wedding Invitation
    </title>

    <!-- ── Social media / Open Graph ──────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content=" عقد قران  | Wedding Invitation" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta
      property="og:title"
      content="أحمد وريهام — عقد قران  | Ahmed &amp; Reham — Wedding Invitation"
      id="og-title"
    />
    <meta
      property="og:description"
      content="يتشرّفان مع عائلتيهما بدعوتكم لحضور حفل زفافهما — الجمعة ٢٦ يونيو ٢٠٢٦ · الخامسة والنصف مساءً &#10;Together with their families, request the honour of your presence — Friday, 26 June 2026 · 5:30 in the evening"
      id="og-desc"
    />
    <meta
      property="og:image"
      content="https://ahemd-reham.s-yosef-mostafa.workers.dev/assets/og-image.png"
      id="og-image"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="أحمد وريهام — عقد قران  | Ahmed &amp; Reham — Wedding Invitation, 26 June 2026"
    />
    <meta
      property="og:url"
      content="https://ahemd-reham.s-yosef-mostafa.workers.dev/"
      id="og-url"
    />

    <!-- ── Twitter / X Card ──────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="أحمد وريهام — عقد قران  | Ahmed &amp; Reham — Wedding Invitation"
      id="tw-title"
    />
    <meta
      name="twitter:description"
      content="يتشرّفان مع عائلتيهما بدعوتكم لحضور حفل زفافهما — الجمعة ٢٦ يونيو ٢٠٢٦ · الخامسة والنصف مساءً &#10;Together with their families, request the honour of your presence — Friday, 26 June 2026 · 5:30 in the evening"
      id="tw-desc"
    />
    <meta
      name="twitter:image"
      content="https://ahemd-reham.s-yosef-mostafa.workers.dev/assets/og-image.png"
      id="tw-image"
    />
    <meta
      name="twitter:image:alt"
      content="أحمد وريهام — عقد قران  | Ahmed &amp; Reham — Wedding Invitation"
    />

    <!-- ── Browser chrome ────────────────────────────────────────── -->
    <meta name="theme-color" content="#173a20" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/favicon-64.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Aref+Ruqaa:wght@400;700&family=Amiri:ital,wght@0,400;1,400&family=Reem+Kufi:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Styles — tokens must load first -->
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/animations.css" />

    <!-- Config — must load before main.js -->
    <script src="config.js"></script>
  </head>
  <body>
    <!-- Islamic geometric lattice background -->
    <div class="bg-pattern" aria-hidden="true"></div>

    <!-- Floating gold petals layer -->
    <div class="petals" id="petals" aria-hidden="true"></div>

    <!-- ============================================================
       TENNIS COURT OPENER
       ============================================================ -->
    <div class="envelope-scene" id="scene">
      <img class="scene-bg" id="scene-bg" src="assets/court-gate.png" alt="" />
      <div
        class="tennis-card"
        id="tcard"
        role="button"
        tabindex="0"
        aria-label="Drag the tennis ball up to open the invitation"
      >
        <div class="card-head" id="court-date">26 JUNE 2026</div>
        <div class="op-names">
          <span class="op-name" id="court-groom-i">A</span>
          <div class="ball-wrap hop" id="ballwrap">
            <div class="tennis-ball" id="ball"></div>
          </div>
          <span class="op-name" id="court-bride-i">R</span>
        </div>
      </div>
    </div>

    <!-- ============================================================
       MAIN INVITATION CARD
       ============================================================ -->
    <main class="invitation" id="invitation">
      <div class="card">
        <!-- Corner diamonds -->
        <span class="corner tl" aria-hidden="true"></span>
        <span class="corner tr" aria-hidden="true"></span>
        <span class="corner bl" aria-hidden="true"></span>
        <span class="corner br" aria-hidden="true"></span>

        <div class="inner">
          <!-- Bismillah -->
          <div class="bismillah gold-foil reveal d1">
            بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
          </div>

          <!-- Ornamental divider -->
          <div class="divider reveal d1" aria-hidden="true">
            <span class="line"></span>
            <span class="gem sm"></span>
            <span class="gem"></span>
            <span class="gem sm"></span>
            <span class="line r"></span>
          </div>

          <!-- Eyebrow label -->
          <p class="eyebrow reveal d2" style="margin-bottom: 1.1em">
            The Wedding Of
          </p>

          <!-- Mihrab arch with couple names -->
          <div class="names reveal d3">
            <div class="arch">
              <div class="name-ar " id="groom-ar"></div>
              <div class="name-en" id="groom-en"></div>
              <div class="amp " aria-label="and">&amp;</div>
              <div class="name-ar name-margin" id="bride-ar"></div>
              <div class="name-en" id="bride-en"></div>
            </div>
          </div>
          <!-- Invitation line (Arabic + English) -->
          <p class="invite-line reveal d2" id="invite-line"></p>
          <!-- Ornamental divider -->
          <div class="divider reveal d4" aria-hidden="true">
            <span class="line"></span>
            <span class="gem sm"></span>
            <span class="gem"></span>
            <span class="gem sm"></span>
            <span class="line r"></span>
          </div>

          <!-- Date -->
          <div class="date-main reveal d4">
            <span class="ar" id="date-ar"></span>
            <span id="date-en"></span>
          </div>
          <div class="date-time reveal d4">
            <span class="ar" id="time-ar"></span>
            <span id="time-en"></span>
          </div>

          <!-- Live countdown -->
          <div
            class="countdown reveal d5"
            id="countdown"
            aria-label="Countdown to the wedding"
            style="margin-top: clamp(20px, 4vw, 30px)"
          >
            <div class="cd-unit">
              <div class="cd-num" id="cd-d">00</div>
              <div class="cd-label">Days</div>
            </div>
            <div class="cd-sep" aria-hidden="true">:</div>
            <div class="cd-unit">
              <div class="cd-num" id="cd-h">00</div>
              <div class="cd-label">Hours</div>
            </div>
            <div class="cd-sep" aria-hidden="true">:</div>
            <div class="cd-unit">
              <div class="cd-num" id="cd-m">00</div>
              <div class="cd-label">Minutes</div>
            </div>
            <div class="cd-sep" aria-hidden="true">:</div>
            <div class="cd-unit">
              <div class="cd-num" id="cd-s">00</div>
              <div class="cd-label">Seconds</div>
            </div>
          </div>

          <!-- Qur'anic verse -->
          <div class="verse reveal d6" style="margin: clamp(26px, 5vw, 40px) 0">
            <div class="ar" id="verse-ar"></div>
            <p class="en" id="verse-en"></p>
            <div class="ref" id="verse-ref"></div>
          </div>

          <!-- Venue -->
          <p class="eyebrow reveal d6" style="margin-bottom: 0.9em">
            The Celebration
          </p>
          <div class="venue-name reveal d6">
            <span class="ar" id="venue-name-ar"></span>
            <span id="venue-name-en"></span>
          </div>
          <div class="venue-addr reveal d6">
            <span class="ar" id="venue-addr-ar"></span>
            <span id="venue-addr-en"></span>
          </div>
          <a
            class="maps-btn reveal d6"
            id="maps-btn"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="pin" aria-hidden="true"></span>
            Open in Google Maps
          </a>

          <!-- Bottom divider + hashtag -->
          <div
            class="divider reveal d7"
            style="margin-top: clamp(28px, 5vw, 40px)"
            aria-hidden="true"
          >
            <span class="line"></span>
            <span class="gem sm"></span>
            <span class="gem"></span>
            <span class="gem sm"></span>
            <span class="line r"></span>
          </div>
          <p class="hashtag reveal d7" id="hashtag"></p>
        </div>
      </div>
    </main>

    <!-- ============================================================
       MUSIC TOGGLE (fixed bottom-right)
       ============================================================ -->
    <button
      class="music-btn"
      id="music-btn"
      aria-label="Toggle background music"
      title="Music"
    >
      <svg
        class="music-note"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        width="22"
        height="22"
        aria-hidden="true"
      >
        <path d="M9 18V5l12-2v13" />
        <circle cx="6" cy="18" r="3" />
        <circle cx="18" cy="16" r="3" />
      </svg>
      <span class="bar" aria-hidden="true"></span>
    </button>
    <audio id="audio" loop preload="none"></audio>

    <!-- Scripts — order matters -->
    <script src="scripts/countdown.js"></script>
    <script src="scripts/petals.js"></script>
    <script src="scripts/music.js"></script>
    <script src="scripts/envelope.js"></script>
    <script src="scripts/main.js"></script>
  </body>
</html>
