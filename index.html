  <body>
    <!-- Geometric lattice background -->
    <div class="bg-pattern" aria-hidden="true"></div>

    <!-- Floating petals layer -->
    <div class="petals" id="petals" aria-hidden="true"></div>

    <!-- ============================================================
       GATE OPENING SCENE
       ============================================================ -->
    <div class="gate-scene" id="gate-scene">

      <div class="gate-frame" id="gate-frame"
           role="button" tabindex="0"
           aria-label="Tap to open the wedding invitation">

        <!-- Light glow revealed when doors open -->
        <div class="gate-light" aria-hidden="true"></div>
        <div class="gate-flash" aria-hidden="true"></div>

        <!-- Left half of the photo door -->
        <div class="gate-door gate-door-left"></div>

        <!-- Center ornament (monogram) -->
        <div class="gate-ornament" aria-hidden="true">
          <span class="gate-monogram" id="gate-monogram">Y&amp;H</span>
        </div>

        <!-- Right half of the photo door -->
        <div class="gate-door gate-door-right"></div>
      </div>


      <!-- Tap hint -->
      <div class="gate-hint" aria-hidden="true">
        <svg class="gate-hint-icon" viewBox="0 0 42 46" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="11" y1="9"  x2="9"  y2="7"/>
          <line x1="14" y1="8"  x2="13" y2="5.5"/>
          <line x1="17" y1="8"  x2="18" y2="5.5"/>
          <line x1="20" y1="10" x2="22" y2="8.5"/>
          <line x1="9"  y1="13" x2="7"  y2="13"/>
          <path d="M12 32 L12 15 A3 3 0 0 1 18 15 L18 27"/>
          <path d="M18 27 L18 19 A3 3 0 0 1 24 19 L24 29"/>
          <path d="M24 29 L24 22 A2.5 2.5 0 0 1 29 22 L29 30"/>
          <path d="M29 30 L29 25 A2 2 0 0 1 33 25 L33 31"/>
          <path d="M12 32 Q9 32 8 36 L9 41 Q10 44 14 44 L28 44 Q35 44 35 37 L35 31 L33 31"/>
        </svg>
        <span class="gate-hint-text">Open Invitation &hearts;</span>
      </div>
    </div>

    <!-- ============================================================
       MAIN INVITATION
       ============================================================ -->
    <main class="invitation" id="invitation">
      <section class="hero" id="invitation-card">
        <div class="inner">
          <div class="bismillah gold-foil">
            بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
          </div>

          <div class="orn" aria-hidden="true">
            <svg viewBox="0 0 240 24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round">
              <path d="M6 12 H86" />
              <path d="M154 12 H234" />
              <path d="M86 12 C94 4.5, 103 4.5, 107 12 C103 19.5, 94 19.5, 86 12 Z" />
              <path d="M154 12 C146 4.5, 137 4.5, 133 12 C137 19.5, 146 19.5, 154 12 Z" />
              <path d="M120 5.5 L126.5 12 L120 18.5 L113.5 12 Z" />
              <circle cx="120" cy="12" r="1.6" fill="currentColor" stroke="none" />
            </svg>
          </div>

          <p class="eyebrow">The Wedding Of</p>

          <div class="names">
            <div class="name-ar" id="groom-ar"></div>
            <div class="name-en" id="groom-en"></div>
            <div class="amp" aria-label="and">&amp;</div>
            <div class="name-ar" id="bride-ar"></div>
            <div class="name-en" id="bride-en"></div>
          </div>

          <p class="invite-line" id="invite-line"></p>

          <!-- ============ WHEN / WHERE ============ -->
          <div class="details-grid">
            <div class="detail-col">
              <p class="section-label">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="16" rx="2" />
                  <path d="M16 3v4M8 3v4M3 11h18" />
                </svg>
                When
              </p>
              <div class="date-main">
                <span class="ar" id="date-ar"></span>
                <span id="date-en"></span>
              </div>
              <div class="date-time">
                <span class="ar" id="time-ar"></span>
                <span id="time-en"></span>
              </div>
            </div>

            <div class="detail-col">
              <p class="section-label">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" aria-hidden="true">
                  <path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z" />
                  <circle cx="12" cy="10" r="2.6" />
                </svg>
                Where
              </p>
              <div class="venue-name">
                <span class="ar" id="venue-name-ar"></span>
                <span id="venue-name-en"></span>
              </div>
              <div class="venue-addr">
                <span class="ar" id="venue-addr-ar"></span>
                <span id="venue-addr-en"></span>
              </div>
              <a class="detail-link" id="maps-btn" target="_blank" rel="noopener noreferrer">Get directions</a>
            </div>
          </div>

          <!-- ============ COUNTDOWN ============ -->
          <p class="section-label">Counting down to the day</p>
          <div class="countdown" id="countdown" aria-label="Countdown to the wedding">
            <div class="cd-unit">
              <div class="cd-num" id="cd-d">00</div>
              <div class="cd-label">Days</div>
            </div>
            <div class="cd-sep" aria-hidden="true">:</div>
            <div class="cd-unit">
              <div class="cd-num" id="cd-h">00</div>
              <div class="cd-label">Hours</div>
            </div>
            <div class="cd-sep" aria-hidden="true">:</div>
            <div class="cd-unit">
              <div class="cd-num" id="cd-m">00</div>
              <div class="cd-label">Minutes</div>
            </div>
            <div class="cd-sep" aria-hidden="true">:</div>
            <div class="cd-unit">
              <div class="cd-num cd-num-accent" id="cd-s">00</div>
              <div class="cd-label">Seconds</div>
            </div>
          </div>

          <!-- ============ BLESSING — Qur'anic verse ============ -->
          <div class="blessing">
            <p class="blessing-label">A Blessing</p>
            <div class="verse">
              <div class="ar" id="verse-ar"></div>
              <p class="en" id="verse-en"></p>
              <div class="ref" id="verse-ref"></div>
            </div>
          </div>

        </div>
      </section>

      <footer class="dev-footer">
        Built with ♡ by

        ><svg class="dev-gh-icon" viewBox="0 0 16 16" fill="currentColor" width="13" height="13" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>Youssef Mostafa</a>
      </footer>
    </main>

    <!-- Toast (share feedback) -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- ============================================================
       MUSIC TOGGLE (fixed bottom-right)
       ============================================================ -->
    <button
      class="music-btn"
      id="music-btn"
      aria-label="Toggle background music"
      aria-pressed="false"
      title="Music"
    >
      <span class="eq" aria-hidden="true">
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
      </span>
    </button>
    <audio id="audio" loop preload="none"></audio>

    <!-- Scripts — order matters -->
    <script src="scripts/countdown.js"></script>
    <script src="scripts/petals.js"></script>
    <script src="scripts/music.js"></script>
    <script src="scripts/gate.js"></script>
    <script src="scripts/calendar.js"></script>
    <script src="scripts/scroll.js"></script>
    <script src="scripts/main.js"></script>
  </body>
